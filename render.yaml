# Short-lived FREE pilot: manual sync; free PostgreSQL expires after 30 days.
services:
  - type: web
    name: sprocket-crm-test
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sprocket-crm-test-db
          property: connectionString
      - key: SPROCKET_TOKEN_SECRET
        generateValue: true
      - key: SPROCKET_SETUP_TOKEN
        generateValue: true
      - key: SPROCKET_WEB_JOBS
        value: "0"
databases:
  - name: sprocket-crm-test-db
    plan: free
    region: oregon
    databaseName: sprocket
    user: sprocket
    ipAllowList: []
