<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SpRocket CRM</title><link rel="stylesheet" href="/style.css"><body class="login-page"><section class="panel"><img class="login-brand" src="/assets/brand/logos/sprocket-horizontal-light.svg" alt="SpRocket CRM"><h1 id="account-title">Sign in</h1><a id="google-sign-in" class="login-link" href="/auth/google" hidden>Sign in with Google</a><p id="google-help" hidden>Use your linked Google account. New members need a workspace invitation.</p><form id="web-account"><div id="setup-fields" hidden><label>Workspace name<input name="workspace" maxlength="100"></label><label>Setup code<input name="token" autocomplete="off"></label></div><div id="join-fields" hidden><label>Your name<input name="name" maxlength="100" autocomplete="name"></label></div><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="current-password"></label><p id="account-error" class="error" role="alert"></p><button class="primary" id="account-submit">Sign in</button></form><p id="account-help">Ask your workspace administrator for an invitation if you do not have an account.</p></section><script src="/web-login.js"></script></body></html>
